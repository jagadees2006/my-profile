<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coin Catcher Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin: 15px 0 8px;
    }

    .info {
        display: flex;
        justify-content: space-around;
        max-width: 500px;
        margin: auto;
        font-size: 18px;
    }

    #game {
        position: relative;
        width: 92%;
        max-width: 500px;
        height: 550px;
        margin: 15px auto;
        overflow: hidden;
        border: 3px solid white;
        border-radius: 18px;
        background:
            radial-gradient(circle at 20% 20%, #334155 1px, transparent 2px),
            radial-gradient(circle at 80% 40%, #334155 1px, transparent 2px),
            #020617;
    }

    #basket {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90px;
        height: 45px;
        background: #f59e0b;
        border-radius: 8px 8px 25px 25px;
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .coin,
    .bomb {
        position: absolute;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    button {
        min-width: 70px;
        min-height: 45px;
        margin: 5px;
        border: none;
        border-radius: 10px;
        background: #334155;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #475569;
    }

    #message {
        min-height: 24px;
    }
</style>
</head>

<body>

<h1>🪙 Coin Catcher</h1>

<div class="info">
    <div>Score: <b id="score">0</b></div>
    <div>Lives: <b id="lives">3</b></div>
    <div>Best: <b id="best">0</b></div>
</div>

<div id="game">
    <div id="basket">🧺</div>
</div>

<p id="message">
    Catch 🪙 coins and avoid 💣 bombs!
</p>

<div>
    <button id="leftBtn">⬅️</button>
    <button id="restartBtn">🔄</button>
    <button id="rightBtn">➡️</button>
</div>

<script>

const game = document.getElementById("game");
const basket = document.getElementById("basket");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
const bestText = document.getElementById("best");
const message = document.getElementById("message");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const restartBtn = document.getElementById("restartBtn");

let basketX = 50;
let score = 0;
let lives = 3;
let best = 0;
let gameRunning = true;

let objects = [];


// Move basket
function moveLeft() {

    if (!gameRunning) return;

    basketX -= 7;

    if (basketX < 8) {
        basketX = 8;
    }

    basket.style.left = basketX + "%";
}


function moveRight() {

    if (!gameRunning) return;

    basketX += 7;

    if (basketX > 92) {
        basketX = 92;
    }

    basket.style.left = basketX + "%";
}


// Keyboard controls
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
        moveLeft();
    }

    if (event.key === "ArrowRight") {
        moveRight();
    }

});


// Mobile buttons
leftBtn.addEventListener("click", moveLeft);
rightBtn.addEventListener("click", moveRight);


// Create falling object
function createObject() {

    if (!gameRunning) return;

    const object = document.createElement("div");

    let isBomb = Math.random() < 0.20;

    if (isBomb) {

        object.className = "bomb";
        object.innerHTML = "💣";

    } else {

        object.className = "coin";
        object.innerHTML = "🪙";

    }

    let x = Math.random() * 90;

    object.style.left = x + "%";
    object.style.top = "-45px";

    game.appendChild(object);

    objects.push({
        element: object,
        x: x,
        y: -45,
        speed: 3 + Math.random() * 2,
        bomb: isBomb
    });
}


// Game loop
function gameLoop() {

    if (!gameRunning) return;

    const basketRect = basket.getBoundingClientRect();

    for (let i = objects.length - 1; i >= 0; i--) {

        let obj = objects[i];

        obj.y += obj.speed;

        obj.element.style.top = obj.y + "px";


        const objectRect =
            obj.element.getBoundingClientRect();


        // Collision
        if (
            basketRect.left < objectRect.right &&
            basketRect.right > objectRect.left &&
            basketRect.top < objectRect.bottom &&
            basketRect.bottom > objectRect.top
        ) {

            if (obj.bomb) {

                lives--;

                livesText.innerText = lives;

                message.innerText =
                    "💥 Bomb! Be careful!";

                if (lives <= 0) {

                    gameOver();

                    return;
                }

            } else {

                score++;

                scoreText.innerText = score;

                if (score > best) {

                    best = score;

                    bestText.innerText = best;
                }

                message.innerText = "🪙 Nice! +1";
            }

            obj.element.remove();
            objects.splice(i, 1);

            continue;
        }


        // Object reached bottom
        if (obj.y > game.clientHeight) {

            obj.element.remove();

            objects.splice(i, 1);
        }
    }

    requestAnimationFrame(gameLoop);
}


// Game Over
function gameOver() {

    gameRunning = false;

    message.innerText =
        "💀 GAME OVER! Your Score: " + score;
}


// Restart game
function restartGame() {

    objects.forEach(obj => {
        obj.element.remove();
    });

    objects = [];

    score = 0;
    lives = 3;
    basketX = 50;

    scoreText.innerText = "0";
    livesText.innerText = "3";

    basket.style.left = "50%";

    message.innerText =
        "Catch 🪙 coins and avoid 💣 bombs!";

    gameRunning = true;

    gameLoop();
}


// Create objects
setInterval(function() {

    if (gameRunning) {
        createObject();
    }

}, 700);


// Start
gameLoop();

</script>

</body>
</html>
